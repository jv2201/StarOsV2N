
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP
        run: unzip -o StarLauncher.zip -d extracted
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          DIR=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          cd "$DIR"
          gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: StarLauncher-apk
          path: extracted/**/build/outputs/apk/release/*.apk
          
